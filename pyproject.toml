[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depthsync"
version = "0.1.0"
description = "Anchor-guided temporal alignment for Live Photo depth sequences"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.scripts]
depthsync = "depthsync.cli:main"

[tool.setuptools.packages.find]
include = ["depthsync*"]
